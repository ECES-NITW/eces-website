name: Share PR preview

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-preview-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: read
      pull-requests: write
    steps:
      # pull_request_target gives comment permission using the base branch's workflow.
      # Never check out, import, or execute code from the pull request here.
      - name: Wait for Cloudflare and comment once
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          marker='<!-- eces-cloudflare-branch-preview -->'
          dashboard='https://dash.cloudflare.com/77740a0c165b8e8f175234ee03731fe5/workers/services/view/eces-website/production'
          # Match Wrangler/Cloudflare's branch preview naming (e.g. feature/login).
          preview=$(printf '%s' "$HEAD_BRANCH" | LC_ALL=C sed -E 's/[^a-zA-Z0-9-]/-/g; s/-+/-/g; s/^-//; s/-$//' | tr '[:upper:]' '[:lower:]')
          if [[ -z "$preview" ]]; then
            echo '::error::The branch name cannot form a Cloudflare preview name.'
            exit 1
          fi
          preview_url="https://$preview-eces-website.georgeaaron005.workers.dev"

          already_shared() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" |
              jq -cs -e --arg marker "$marker" --arg url "$preview_url" '
                any(.[][]; .user.type == "Bot" and
                  (.user.login == "github-actions[bot]" or .user.login == "cloudflare-workers-and-pages[bot]") and
                  ((.body // "") | contains($marker) or contains($url)))' >/dev/null
          }

          if already_shared; then
            echo 'The PR already has its branch preview link.'
            exit 0
          fi

          # Cloudflare builds independently of Actions; it may also finish before PR creation.
          deadline=$((SECONDS + 1620))
          while (( SECONDS < deadline )); do
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            if ! jq -e --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .state == "open" and .base.ref == "main" and
              .head.sha == $sha and .head.repo.full_name == $repo' <<< "$pr" >/dev/null; then
              echo 'The PR closed, changed target, or advanced; this run is no longer needed.'
              exit 0
            fi

            # A SHA can exist on multiple branches; require this Worker's exact preview.
            build=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" |
              jq -cs --arg prefix "$dashboard/previews/$preview/builds/" '
                [.[].check_runs[] | select(.app.slug == "cloudflare-workers-and-pages")
                  | select((.details_url // "") | startswith($prefix))]
                | max_by(.id) // empty')
            if [[ "$(jq -r '.status' <<< "$build")" == completed ]]; then
              if [[ "$(jq -r '.conclusion' <<< "$build")" != success ]]; then
                echo '::error::Cloudflare preview build failed. Fix or retry the build, then re-run this workflow.'
                exit 1
              fi

              # Recheck after waiting in case Cloudflare posted its native comment meanwhile.
              if already_shared; then
                echo 'The PR already has its branch preview link.'
                exit 0
              fi
              # Do not post for a PR that changed while the check was being fetched.
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
                jq -e --arg sha "$HEAD_SHA" '.state == "open" and .base.ref == "main" and .head.sha == $sha' >/dev/null || exit 0

              printf '%s\n### Cloudflare preview\n\n[Open branch preview](%s)\n\nThis link updates automatically after successful builds on this branch.\n' \
                "$marker" "$preview_url" > "$RUNNER_TEMP/preview-comment.md"
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/preview-comment.md"
              cat "$RUNNER_TEMP/preview-comment.md" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done

          echo '::error::Cloudflare did not finish a matching preview within 27 minutes. Check Cloudflare Builds, then re-run this workflow.'
          exit 1
